name: Deploy Astro-SSG to GitHub Pages

on:
  push:
    branches: ["master", "main"]
    paths:
      - 'Astro-SSG/**' # Solo se ejecuta si hay cambios dentro del proyecto de Astro
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-astro"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Esto le dice a GitHub Actions que ejecute los comandos 'run' dentro de tu subcarpeta
    defaults:
      run:
        working-directory: ./Astro-SSG

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./Astro-SSG/package-lock.json

      - name: Instalar dependencias
        run: npm install # Usamos install por si no has generado un package-lock.json estricto

      - name: Construir el proyecto Astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Indicamos la ruta exacta donde Astro genera los archivos compilados
          path: ./Astro-SSG/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5